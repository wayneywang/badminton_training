name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 第 1 阶段:部署 PWA 到 GitHub Pages ----------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show Pages URL
        run: |
          echo "PWA 已部署到: ${{ steps.deploy.outputs.page_url }}"
          sleep 15

      # ---------- 第 2 阶段:准备 JDK + Android SDK ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0'

      # ---------- 第 3 阶段:预写 Bubblewrap 配置绕过交互 prompt ----------
      - name: Pre-write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "--- config.json ---"
          cat "$HOME/.bubblewrap/config.json"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Badminton Training, OU=Dev, O=Personal, L=Beijing, ST=Beijing, C=CN"

      # ---------- 第 4 阶段:手写 twa-manifest.json + 用 update 生成 Android 项目 ----------
      # 跳过 `bubblewrap init`(它会问 Domain/Name/Theme color 等交互 prompt,
      # 非 TTY 环境下 inquirer 直接 exit 130)。
      # 直接手写完整的 twa-manifest.json,然后用 `bubblewrap update` 生成 Android 项目文件。
      - name: Create twa-manifest.json
        run: |
          mkdir -p android
          cat > android/twa-manifest.json <<'EOF'
          {
            "packageId": "com.wayneywang.badminton_training",
            "host": "wayneywang.github.io",
            "name": "羽毛球双打体能训练",
            "launcherName": "羽训",
            "themeColor": "#1a73e8",
            "themeColorDark": "#1a73e8",
            "navigationColor": "#1a73e8",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#1a73e8",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "enableNotifications": true,
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "/home/runner/work/badminton_training/badminton_training/release.keystore",
              "alias": "release"
            },
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "shortName": "羽训",
            "fullScopeUrl": "https://wayneywang.github.io/badminton_training/",
            "startUrl": "/badminton_training/index.html",
            "iconUrl": "https://wayneywang.github.io/badminton_training/icon.svg",
            "webManifestUrl": "https://wayneywang.github.io/badminton_training/manifest.json",
            "display": "standalone",
            "orientation": "portrait",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "enableSiteSettingsShortcut": false,
            "fallbackType": "customtabs",
            "features": [],
            "alphaDependencies": { "enabled": false },
            "generatorApp": "bubblewrap-cli",
            "shortcuts": [],
            "retainedBundles": []
          }
          EOF
          echo "--- twa-manifest.json ---"
          cat android/twa-manifest.json

      # 用 update 命令从 twa-manifest.json 生成 Android 项目(无交互)
      # 注意:新版 Bubblewrap 用 --manifest 指定 twa-manifest.json 所在目录,--directory 已无效
      - name: Generate Android project (bubblewrap update)
        run: bubblewrap update --manifest android --skipVersionUpgrade --yes

      # 用 build 命令编译 APK(密码通过环境变量传入,避免 prompt)
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
        run: |
          bubblewrap build \
            --manifest android \
            --skipPwaValidation \
            --signing-key-path ${{ github.workspace }}/release.keystore \
            --signing-key-alias release \
            --signing-key-password changeit \
            --keystore-password changeit

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badminton-training-apk
          path: android/app-release-signed.apk
          retention-days: 30
          if-no-files-found: error
