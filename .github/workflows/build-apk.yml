name: Build Android APK

# 触发条件:推送到 main/master 自动构建,或手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages 部署 + artifact 上传所需权限
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 第 1 阶段:部署 PWA 到 GitHub Pages ----------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show Pages URL
        run: |
          echo "PWA 已部署到: ${{ steps.deploy.outputs.page_url }}"
          sleep 15

      # ---------- 第 2 阶段:准备 JDK + Android SDK ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0'

      # ---------- 第 3 阶段:预写 Bubblewrap 配置,绕过所有交互 prompt ----------
      # Bubblewrap 首次运行会问 "Do you want to install JDK?" 和 "Path to JDK",
      # 但 stdin 非 TTY 时 inquirer 直接 exit 130。预先写好 ~/.bubblewrap/config.json
      # 让 Bubblewrap 读到配置后跳过这些问题。
      - name: Pre-write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "--- config.json ---"
          cat "$HOME/.bubblewrap/config.json"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Verify Bubblewrap config (doctor)
        run: bubblewrap doctor || true

      # 生成自签名 keystore 用于 APK 签名(可直接安装,非 Play Store 发布用)
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Badminton Training, OU=Dev, O=Personal, L=Beijing, ST=Beijing, C=CN"

      # ---------- 第 4 阶段:用 Bubblewrap 生成 TWA APK ----------
      # 配置已预写,JDK prompt 已绕过。
      # 预先创建 android 目录,避免 bubblewrap 问 "Directory does not exist. Create?"
      - name: Init TWA project
        run: |
          mkdir -p android
          bubblewrap init \
            --manifest "${{ steps.deploy.outputs.page_url }}manifest.json" \
            --directory android \
            --yes

      - name: Build APK
        run: |
          bubblewrap build \
            --directory android \
            --signing-key-path ${{ github.workspace }}/release.keystore \
            --signing-key-alias release \
            --signing-key-password changeit \
            --keystore-password changeit

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badminton-training-apk
          path: android/app-release-signed.apk
          retention-days: 30
          if-no-files-found: error
