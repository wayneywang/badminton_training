name: Build Android APK

# 触发条件:推送到 main/master 自动构建,或手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages 部署 + artifact 上传所需权限
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 关联 Pages 环境,便于权限隔离
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 第 1 阶段:部署 PWA 到 GitHub Pages ----------
      # Bubblewrap 必须能从公网 HTTPS 拉取 manifest.json,
      # 因此先把整个 PWA 部署到 Pages,再让 Bubblewrap 用这个 URL。
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show Pages URL
        run: |
          echo "PWA 已部署到: ${{ steps.deploy.outputs.page_url }}"
          # 给 Pages CDN 一点时间生效,避免 bubblewrap fetch 失败
          sleep 15

      # ---------- 第 2 阶段:用 Bubblewrap 生成 TWA APK ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # 生成一个自签名 keystore 用于 APK 签名
      # (不是 release 正式签名,但生成的 APK 可直接安装)
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Badminton Training, OU=Dev, O=Personal, L=Beijing, ST=Beijing, C=CN"

      # 初始化 TWA 项目。
      # 前面 setup-java 已装 JDK 17,这里拒绝 Bubblewrap 再次安装 JDK(选 No)。
      # 用管道喂答案绕开交互 prompt;--yes 跳过其余问题使用默认值。
      - name: Init TWA project
        run: |
          printf 'No\n' | bubblewrap init \
            --manifest "${{ steps.deploy.outputs.page_url }}manifest.json" \
            --directory android \
            --yes

      # 构建 APK,用刚才生成的 keystore 签名
      - name: Build APK
        run: |
          bubblewrap build \
            --directory android \
            --signing-key-path ${{ github.workspace }}/release.keystore \
            --signing-key-alias release \
            --signing-key-password changeit \
            --keystore-password changeit

      # 上传 APK 作为 artifact,可从 Actions 运行页面下载
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badminton-training-apk
          # bubblewrap build 默认输出文件名
          path: android/app-release-signed.apk
          retention-days: 30
          if-no-files-found: error
